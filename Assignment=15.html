
<html lang="en">
<head>

    <title>Assignment 15: Form: Input Elements, Label and Fieldset</title>
</head>
<body>
  

    <form>
        <fieldset>
            <legend>Personal Details</legend>

            Name:
            <input type="text" size="30">
            <br><br>

            Email:
            <input type="email" size="30">
            <br><br>

            Password:
            <input type="password" size="30">
            <br><br>

            Gender:
            <input type="radio" name="gender">Male
            <input type="radio" name="gender">Female
            <br><br>

            Hobbies:
            <input type="checkbox">Reading
            <input type="checkbox">Coding
            <br><br>

            DOB:
            <input type="text" size="30">

        </fieldset>
    </form>


</body>
</html>
