<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Experiment 4</title>
</head>
<body>
    <h1><b><center>Hotel Room Booking Form</center></b></h1>
    
<form align="center" style="border: 2px solid black; padding: 24px; width: 450px; margin: 30px auto;">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>
    <label for="Phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone"required><br><br>
    <label for="checkin">Check-in Date:</label>
    <input type="date" id="checkin" name="checkin" required><br><br>
    <label for="checkout">Check-out Date:</label>
    <input type="date" id="checkout" name="checkout" required><br><br>
    <label for="roomtype">Room Type:</label>
    <select id="room" name="room" required>
        <option value="">Select a room type</option>
        <option>Single Room</option>
        <option>Double Room</option>
        <option>Suite Room</option>
    </select><br><br>
    <label for="guests">Number of Guests:</label>
    <input type="number" id="guests" name="guests" min="1" max="10" required><br><br>
    <label for="requests">Special Requests:</label><br>
    <textarea id="requests" name="requests" rows="4" cols="30">
</textarea><br><br>
<button type="submit">Book Now</button>  
<button type="reset">Reset Now</button>
</form>
</fieldset>
</body>
</html>
