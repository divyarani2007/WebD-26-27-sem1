<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Experiment 5</title>
</head>
<body>
    <h1><b><center>Student Registration Form</center></b></h1>
    <hr>
<form>
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

    <label for="gender">Gender:</label>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female" required>
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other" required>
    <label for="other">Other</label><br><br>

<label for="course">Course:</label>
<select id="course" name="course" required>
    <option value="">Select a course</option>
    <option value="btech">B.Tech</option>
    <option value="mtech">M.Tech</option>
    <option value="mba">MBA</option>
    <option value="msc">M.Sc</option>
</select><br><br>
<label for="contact">Contact Number:</label>
<input type="tel" id="contact" name="contact" placeholder="Enter your contact number" required><br><br>
    <label for="address">Address:</label><br>
    <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address"></textarea><br><br>
</textarea><br><br>
<button type="submit">Register</button>  
<button type="reset">Clear</button>
</form><hr>
<p><h4><center>&copy; 2026 Student Registration Portal</center></h4></p>
</body>
</html>
